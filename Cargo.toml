[package]
name = "vsgrep"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "ripgrep-like local semantic (vector) search CLI"
repository = "https://github.com/Coxless/vsgrep"
readme = "README.md"
keywords = ["grep", "search", "semantic", "vector", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "vsgrep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "load-dynamic"] }
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
